server:
  port: 8088
  servlet:
    context-path: /api

spring:
  application:
    name: xgs-water-dispenser
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:xgs_water}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:xgs2024}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.xgs.water.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 全园设备快速检索
device:
  search:
    # 游标 HMAC 签名密钥：多实例部署必须共用同一密钥；生产请通过环境变量覆盖
    cursor-key: ${DEVICE_CURSOR_KEY:xgs-device-search-cursor-key-2026}
    # 翻页游标有效期（毫秒），默认 30 分钟；过期后前端保留筛选并从起点重查
    cursor-ttl-ms: 1800000
    # Redis 探测到故障后，多少毫秒内直接走数据库，避免连接超时拖慢检索
    cache-degrade-ms: 5000

logging:
  level:
    com.xgs.water: info
    root: warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
