server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:wqtest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=20000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
      data-locations: classpath:data.sql
  data:
    redis:
      host: 127.0.0.1
      port: 6379

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.xgs.water.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# 检索游标签名使用固定测试密钥（HMAC 可重放构造过期令牌）
device:
  search:
    cursor-key: test-cursor-key
    cursor-ttl-ms: 1800000

logging:
  level:
    com.xgs.water: warn
